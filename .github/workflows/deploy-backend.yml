name: Deploy Global Backend

on:
  push:
    branches: [main]
    paths:
      - backend/**
  workflow_dispatch:

# One deploy at a time. Without this, merging several PRs in a row starts several
# deploys that build concurrently on the VPS and race on the `current` symlink and
# the old-release cleanup. With cancel-in-progress off, a running deploy finishes,
# and only the newest waiting run is kept.
concurrency:
  group: deploy-global-backend
  cancel-in-progress: false

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    environment: timewatchglobal

    steps:
      - uses: actions/checkout@v4

      - name: Deploy backend to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          BACKEND_PATH: ${{ secrets.BACKEND_PATH }}
        run: |
          set -e

          echo "$VPS_SSH_KEY" > key.pem
          chmod 600 key.pem

          export SSH_OPTIONS="-o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=5 -i key.pem"

          TIMESTAMP=$(date +%Y%m%d%H%M%S)

          echo "🚀 Deploying backend release: $TIMESTAMP"

          # Create a NEW release folder — never touch live code directly
          ssh $SSH_OPTIONS $VPS_USER@$VPS_HOST \
            "mkdir -p $BACKEND_PATH/releases/$TIMESTAMP"

          # Upload code to the new release
          rsync -az backend/ \
            --delete \
            -e "ssh $SSH_OPTIONS" \
            $VPS_USER@$VPS_HOST:$BACKEND_PATH/releases/$TIMESTAMP/

          # Link shared public folder so uploads persist across releases
          ssh $SSH_OPTIONS $VPS_USER@$VPS_HOST \
            "rm -rf $BACKEND_PATH/releases/$TIMESTAMP/public && \
             ln -sfn $BACKEND_PATH/shared/public $BACKEND_PATH/releases/$TIMESTAMP/public"

          # Link shared .env — env never lives inside a release
          ssh $SSH_OPTIONS $VPS_USER@$VPS_HOST "
            if [ ! -f $BACKEND_PATH/shared/.env ]; then
              echo '⚠️ shared/.env not found. Please create it once.'
              exit 1
            fi
            ln -sfn $BACKEND_PATH/shared/.env $BACKEND_PATH/releases/$TIMESTAMP/.env
          "

          # Install production dependencies BEFORE going live
          ssh $SSH_OPTIONS $VPS_USER@$VPS_HOST \
            "cd $BACKEND_PATH/releases/$TIMESTAMP && npm install --production"

          # Health check the new release without touching live PM2.
          # Runs on a scratch port so it tests THIS release rather than whatever
          # pm2 already has listening on 5003, and so it cannot collide with it.
          # PORT is passed in the environment; dotenv does not override variables
          # that are already set, so it wins over PORT=5003 in shared/.env.
          ssh $SSH_OPTIONS $VPS_USER@$VPS_HOST "
            cd $BACKEND_PATH/releases/$TIMESTAMP &&
            PORT=5903 node app.js > /tmp/global-backend-test.log 2>&1 &
            TESTPID=\$!
            OK=0
            for i in \$(seq 1 20); do
              if curl -fs http://127.0.0.1:5903/api/health > /dev/null; then OK=1; break; fi
              sleep 1
            done
            kill \$TESTPID 2>/dev/null || true
            wait \$TESTPID 2>/dev/null || true
            if [ \"\$OK\" != \"1\" ]; then
              echo '❌ New release failed to serve /api/health:'
              cat /tmp/global-backend-test.log
              exit 1
            fi
            echo '✅ New release healthy'
          "

          # Switch current symlink (atomic)
          ssh $SSH_OPTIONS $VPS_USER@$VPS_HOST \
            "ln -sfn $BACKEND_PATH/releases/$TIMESTAMP $BACKEND_PATH/current"

          # Reload PM2 (zero downtime)
          ssh $SSH_OPTIONS $VPS_USER@$VPS_HOST "
            cd $BACKEND_PATH/current &&
            (pm2 reload ecosystem.config.cjs --only global-backend --update-env || pm2 start ecosystem.config.cjs) &&
            pm2 save
          "

          # Keep the last 2 releases
          ssh $SSH_OPTIONS $VPS_USER@$VPS_HOST \
            "cd $BACKEND_PATH/releases && ls -1dt */ | tail -n +3 | xargs -r rm -rf"

          echo "✅ Backend deployment completed safely"

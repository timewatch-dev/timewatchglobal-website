name: Deploy Global Website

on:
  push:
    branches: [main]
    paths:
      - website/**
  workflow_dispatch:

jobs:
  deploy-website:
    runs-on: ubuntu-latest
    environment: timewatchglobal

    steps:
      - uses: actions/checkout@v4

      - name: Deploy website to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          WEBSITE_PATH: ${{ secrets.WEBSITE_PATH }}
        run: |
          set -e

          echo "$VPS_SSH_KEY" > key.pem
          chmod 600 key.pem

          export SSH_OPTIONS="-o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=5 -i key.pem"

          TIMESTAMP=$(date +%Y%m%d%H%M%S)

          echo "🚀 Deploying website release: $TIMESTAMP"

          # Create release directory
          ssh $SSH_OPTIONS $VPS_USER@$VPS_HOST \
            "mkdir -p $WEBSITE_PATH/releases/$TIMESTAMP"

          # Sync website code
          rsync -az website/ \
            --delete \
            -e "ssh $SSH_OPTIONS" \
            $VPS_USER@$VPS_HOST:$WEBSITE_PATH/releases/$TIMESTAMP/

          # Install and build (no .env dependency)
          ssh $SSH_OPTIONS $VPS_USER@$VPS_HOST "
            cd $WEBSITE_PATH/releases/$TIMESTAMP &&
            npm install &&
            npm run build
          "

          # Switch current symlink
          ssh $SSH_OPTIONS $VPS_USER@$VPS_HOST \
            "ln -sfn $WEBSITE_PATH/releases/$TIMESTAMP $WEBSITE_PATH/current"

          # Restart via PM2
          ssh $SSH_OPTIONS $VPS_USER@$VPS_HOST "
            cd $WEBSITE_PATH/current &&
            pm2 reload ecosystem.config.cjs --update-env || pm2 start ecosystem.config.cjs &&
            pm2 save
          "

          # Cleanup old releases
          ssh $SSH_OPTIONS $VPS_USER@$VPS_HOST \
            "cd $WEBSITE_PATH/releases && ls -1dt */ | tail -n +3 | xargs -r rm -rf"

          echo "✅ Website deployment completed successfully"

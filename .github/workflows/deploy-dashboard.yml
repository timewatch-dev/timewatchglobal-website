name: Deploy Global Dashboard

on:
  push:
    branches: [main]
    paths:
      - dashboard/**
  workflow_dispatch:

# One deploy at a time. Without this, merging several PRs in a row starts several
# deploys that build concurrently on the VPS and race on the `current` symlink and
# the old-release cleanup. With cancel-in-progress off, a running deploy finishes,
# and only the newest waiting run is kept.
concurrency:
  group: deploy-global-dashboard
  cancel-in-progress: false

jobs:
  deploy-dashboard:
    runs-on: ubuntu-latest
    environment: timewatchglobal

    steps:
      - uses: actions/checkout@v4

      - name: Deploy dashboard to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          DASHBOARD_PATH: ${{ secrets.DASHBOARD_PATH }}
        run: |
          set -e

          echo "$VPS_SSH_KEY" > key.pem
          chmod 600 key.pem

          export SSH_OPTIONS="-o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=5 -i key.pem"

          TIMESTAMP=$(date +%Y%m%d%H%M%S)

          echo "🚀 Deploying dashboard release: $TIMESTAMP"

          # Create release directory
          ssh $SSH_OPTIONS $VPS_USER@$VPS_HOST \
            "mkdir -p $DASHBOARD_PATH/releases/$TIMESTAMP"

          # Sync dashboard code
          rsync -az dashboard/ \
            --delete \
            -e "ssh $SSH_OPTIONS" \
            $VPS_USER@$VPS_HOST:$DASHBOARD_PATH/releases/$TIMESTAMP/

          # Link shared .env (API URL is baked in at build; AI keys are read at runtime) + install + build
          ssh $SSH_OPTIONS $VPS_USER@$VPS_HOST "
            cd $DASHBOARD_PATH/releases/$TIMESTAMP &&
            if [ -f $DASHBOARD_PATH/shared/.env ]; then
              ln -sfn $DASHBOARD_PATH/shared/.env .env
            else
              echo '⚠️ shared/.env not found. Please create it once.'
              exit 1
            fi &&
            npm ci &&
            npm run build
          "

          # Switch current symlink
          ssh $SSH_OPTIONS $VPS_USER@$VPS_HOST \
            "ln -sfn $DASHBOARD_PATH/releases/$TIMESTAMP $DASHBOARD_PATH/current"

          # Restart dashboard
          ssh $SSH_OPTIONS $VPS_USER@$VPS_HOST "
            cd $DASHBOARD_PATH/current &&
            (pm2 reload ecosystem.config.cjs --update-env || pm2 start ecosystem.config.cjs) &&
            pm2 save
          "

          # Cleanup old releases (keep only the live release)
          ssh $SSH_OPTIONS $VPS_USER@$VPS_HOST \
            "cd $DASHBOARD_PATH/releases && ls -1dt */ | tail -n +2 | xargs -r rm -rf"

          echo "✅ Dashboard deployment completed successfully"
